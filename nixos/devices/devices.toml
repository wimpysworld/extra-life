dtoverlays = [
  "dpi24",
  "pwm-audio-pi-zero",
  "gpio-poweroff,gpiopin=26,active_low=1,input=1",
  "gpio-shutdown,gpio_pin=27,active_low=1,gpio_pull=up",
]

[cases.deskpi-pro]
name = "DeskPi Pro v1 / v2"
profile = "deskpi-pro"
socs = ["rpi4"]
dtoverlays = ["dwc2,dr_mode=host"]

[cases.argon-one]
name = "Argon ONE v2 / v3"
profile = "argon-one"
socs = ["rpi4", "rpi5"]
dtoverlays = ["gpio-shutdown,gpio_pin=4,active_low=0,gpio_pull=down"]
