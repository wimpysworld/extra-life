[cases.retroflag-nespi]
name = "RetroFlag NESPi Case+ / NESPi 4 Case"
profile = "retroflag"
socs = ["rpi02w", "rpi4"]
dtoverlays = [
  "gpio-poweroff,gpiopin=4,active_low=1,input=1",
  "gpio-shutdown,gpio_pin=3,active_low=1,gpio_pull=up",
]

[cases.retroflag-superpi]
name = "RetroFlag SUPERPi Case"
profile = "retroflag"
socs = ["rpi02w", "rpi4"]
dtoverlays = [
  "gpio-poweroff,gpiopin=4,active_low=1,input=1",
  "gpio-shutdown,gpio_pin=3,active_low=1,gpio_pull=up",
]

[cases.retroflag-megapi]
name = "RetroFlag MegaPi Case"
profile = "retroflag"
socs = ["rpi02w"]
dtoverlays = [
  "gpio-poweroff,gpiopin=4,active_low=1,input=1",
  "gpio-shutdown,gpio_pin=3,active_low=1,gpio_pull=up",
]

[cases.retroflag-pistation]
name = "RetroFlag PiStation Case"
profile = "retroflag"
socs = ["rpi4"]
dtoverlays = [
  "gpio-poweroff,gpiopin=4,active_low=1,input=1",
  "gpio-shutdown,gpio_pin=3,active_low=1,gpio_pull=up",
]

[cases.retroflag-gpi-case]
name = "RetroFlag GPi Case v1"
profile = "gpi-case"
socs = ["rpi02w"]
dtoverlays = [
  "dpi24",
  "pwm-audio-pi-zero",
  "gpio-poweroff,gpiopin=26,active_low=1,input=1",
  "gpio-shutdown,gpio_pin=27,active_low=1,gpio_pull=up",
]

[cases.retroflag-gpi-case-2]
name = "RetroFlag GPi Case 2"
profile = "gpi-case-2"
socs = ["rpi4"]
dtoverlays = [
  "dpi24",
  "audremap,pins_18_19",
  "gpio-poweroff,gpiopin=26,active_low=1,input=1",
  "gpio-shutdown,gpio_pin=27,active_low=1,gpio_pull=up",
]

[cases.retroflag-gpi-case-2w]
name = "RetroFlag GPi Case 2W"
profile = "gpi-case-2w"
