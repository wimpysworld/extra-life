name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.soc }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - soc: x86_64
            system: x86_64-linux
            runner: ubuntu-24.04
          - soc: aarch64
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: rpi02w
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: rpi4
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: rpi5
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: rk3326
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: rk3566
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: rk3588
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: h700
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: sm6115
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: sm6125
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: sm8250
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - soc: sm8550
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build family
        shell: bash
        env:
          SOC: ${{ matrix.soc }}
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          trap 'status=$?; printf "Exit status: %s\n" "$status" | tee -a build.log; df -h | tee -a build.log; exit "$status"' EXIT
          df -h | tee build.log
          nix shell --no-update-lock-file --inputs-from . nixpkgs#just nixpkgs#jq \
            --command just build-family "$SOC" "$SYSTEM" 2>&1 | tee -a build.log
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.soc }}
          path: build.log
          if-no-files-found: warn
          retention-days: 14
